# Generate CNInfo (巨潮资讯) announcements RSS feed on schedule
# Default: every 6 hours

name: Generate CNInfo Feed

on:
  schedule:
    # Every 6 hours (0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full refresh (ignore cache)'
        required: false
        default: false
        type: boolean
      max_articles:
        description: 'Max articles in the feed'
        required: false
        default: '50'
        type: string

env:
  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
  # 巨潮：按分类抓全市场最新公告，CI 不持久化 PDF，关闭下载
  CNINFO_CATEGORY: 'category_ndbg_szsh;category_sjdbg_szsh'
  CNINFO_DOWNLOAD_PDF: 'false'
  CNINFO_MAX_ITEMS: '30'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CNInfo generator
        env:
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '50' }}
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            python scripts/run_single.py cninfo_announcements --full --max $MAX_ARTICLES
          else
            python scripts/run_single.py cninfo_announcements --max $MAX_ARTICLES
          fi

      - name: Validate feed
        run: python scripts/validate_feeds.py feeds/feed_cninfo_announcements.xml

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add feeds/feed_cninfo_announcements.xml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update CNInfo announcements feed [skip ci]"
            git push
          fi
